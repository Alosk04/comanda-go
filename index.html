<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comanda Go!</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
body{padding-bottom:100px} .modal{display:none} .modal.show{display:flex}
button,input,select{touch-action:manipulation} .card{border:1px solid #e5e7eb}
.dark .card{border-color:#334155}
</style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-slate-900 dark:text-gray-100 min-h-screen">
<header class="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b dark:border-slate-700 shadow-sm">
 <div class="max-w-6xl mx-auto p-3 space-y-3">
  <div class="flex items-center justify-between gap-2"><h1 class="font-black text-xl text-red-600">🚀 Comanda Go!</h1>
   <div class="flex gap-2"><button class="btn" onclick="toggleTheme()">🌙 Tema</button><button class="btn" onclick="openProducts()">⚙️ Produtos</button></div>
  </div>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
   <div class="rounded-xl p-3 bg-emerald-600 text-white"><p class="text-xs">Recebido hoje</p><strong id="received" class="text-lg">R$ 0,00</strong></div>
   <div class="rounded-xl p-3 bg-rose-600 text-white"><p class="text-xs">Pendente aberto</p><strong id="pending" class="text-lg">R$ 0,00</strong></div>
   <div class="rounded-xl p-3 bg-sky-700 text-white"><p class="text-xs">Comandas abertas</p><strong id="openCount" class="text-lg">0</strong></div>
   <div class="rounded-xl p-3 bg-amber-500 text-white"><p class="text-xs">Caixa</p><strong id="cashStatus" class="text-lg">Fechado</strong></div>
  </div>
  <div class="flex gap-2"><input id="search" class="field flex-1" placeholder="🔍 Buscar mesa ou cliente..." oninput="renderOrders()">
   <button class="btn" onclick="load()">↻ Atualizar</button></div>
 </div>
</header>
<main class="max-w-6xl mx-auto p-3">
 <div class="flex flex-wrap gap-2 mb-4">
  <button class="primary" onclick="newOrder()">＋ Nova comanda</button>
  <button class="amber" onclick="newOrder(true)">⚡ Balcão expresso</button>
  <button class="green" onclick="openCash()">📊 Caixa</button>
 </div>
 <div class="flex items-center justify-between mb-3"><h2 class="font-black text-lg">Comandas abertas</h2><span class="text-xs text-gray-500">Toque em uma comanda para lançar consumo</span></div>
 <div id="orders" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3"></div>
</main>
<div id="toast" class="fixed bottom-24 left-4 right-4 md:left-auto md:w-96 bg-slate-900 text-white p-4 rounded-xl shadow-xl z-50 hidden"></div>
<div id="orderModal" class="modal fixed inset-0 bg-black/60 z-40 items-center justify-center p-3"><section class="bg-white dark:bg-slate-800 rounded-2xl p-4 w-full max-w-xl max-h-[92vh] overflow-y-auto">
 <div class="flex justify-between gap-2 items-start"><div><h2 id="orderTitle" class="font-black text-lg">Comanda</h2><p id="orderTotal" class="text-sm text-gray-500"></p></div><button class="btn" onclick="closeModal('orderModal')">✕</button></div>
 <div class="grid grid-cols-2 gap-2 my-3"><input id="productSearch" class="field col-span-2" placeholder="Buscar produto..." oninput="renderProducts()"><select id="category" class="field col-span-2" onchange="renderProducts()"><option value="">Todas as categorias</option></select></div>
 <div id="productButtons" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
 <div class="border-t dark:border-slate-700 mt-4 pt-3"><h3 class="font-bold mb-2">Consumo lançado</h3><div id="items" class="space-y-2"></div></div>
 <div class="mt-4 p-3 rounded-xl bg-gray-50 dark:bg-slate-900"><h3 class="font-bold mb-2">Item avulso</h3><div class="grid grid-cols-2 gap-2"><input id="manualName" class="field" placeholder="Descrição"><input id="manualPrice" class="field" type="number" min="0" step=".01" placeholder="Preço R$"><input id="manualQty" class="field" type="number" min="1" value="1" placeholder="Qtd"><button class="primary" onclick="addManual()">Adicionar</button></div></div>
 <div class="flex gap-2 mt-4"><button class="green flex-1" onclick="openPayment()">💵 Receber pagamento</button><button class="btn" onclick="closeModal('orderModal')">Pronto</button></div>
 </section></div>
<div id="newModal" class="modal fixed inset-0 bg-black/60 z-40 items-center justify-center p-3"><section class="bg-white dark:bg-slate-800 rounded-2xl p-5 w-full max-w-md"><h2 class="font-black text-lg mb-3">Nova comanda</h2><input id="customer" class="field w-full mb-3" placeholder="Mesa 03 ou nome do cliente"><div class="flex gap-2"><button class="btn flex-1" onclick="closeModal('newModal')">Cancelar</button><button class="primary flex-1" onclick="createOrder()">Criar</button></div></section></div>
<div id="payModal" class="modal fixed inset-0 bg-black/60 z-50 items-center justify-center p-3"><section class="bg-white dark:bg-slate-800 rounded-2xl p-5 w-full max-w-md"><h2 class="font-black text-lg">Receber pagamento</h2><p id="payBalance" class="text-2xl font-black text-emerald-600 my-3"></p><label class="label">Valor deste pagamento (R$)</label><input id="payAmount" class="field w-full mb-3" type="number" min=".01" step=".01"><label class="label">Forma de pagamento</label><select id="payMethod" class="field w-full mb-3" onchange="cashFields()"><option>PIX</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option></select><div id="cashFields" class="mb-3"><label class="label">Dinheiro recebido (R$)</label><input id="payReceived" class="field w-full" type="number" min="0" step=".01"></div><div class="flex gap-2"><button class="btn flex-1" onclick="closeModal('payModal')">Cancelar</button><button class="green flex-1" onclick="pay()">Confirmar</button></div></section></div>
<div id="productsModal" class="modal fixed inset-0 bg-black/60 z-40 items-center justify-center p-3"><section class="bg-white dark:bg-slate-800 rounded-2xl p-5 w-full max-w-md max-h-[90vh] overflow-y-auto"><div class="flex justify-between"><h2 class="font-black text-lg">⚙️ Produtos</h2><button class="btn" onclick="closeModal('productsModal')">✕</button></div><div class="space-y-2 my-3"><input id="pName" class="field w-full" placeholder="Nome do produto"><input id="pCat" class="field w-full" placeholder="Categoria"><input id="pPrice" class="field w-full" type="number" min="0" step=".01" placeholder="Preço R$"><button class="primary w-full" onclick="saveProduct()">Cadastrar produto</button></div><div id="productList" class="space-y-2"></div></section></div>
<div id="cashModal" class="modal fixed inset-0 bg-black/60 z-40 items-center justify-center p-3"><section class="bg-white dark:bg-slate-800 rounded-2xl p-5 w-full max-w-lg max-h-[92vh] overflow-y-auto"><div class="flex justify-between"><h2 class="font-black text-lg">📊 Fechamento de caixa</h2><button class="btn" onclick="closeModal('cashModal')">✕</button></div><div id="cashReport" class="my-3 space-y-2"></div><div id="cashOpenForm" class="space-y-2"><label class="label">Valor inicial do caixa (R$)</label><input id="opening" type="number" min="0" step=".01" value="0" class="field w-full"><button class="primary w-full" onclick="startCash()">Abrir caixa</button></div><div id="cashMovementForm" class="hidden space-y-2 border-t dark:border-slate-700 pt-3 mt-3"><h3 class="font-bold">Registrar movimentação</h3><select id="moveKind" class="field w-full"><option value="expense">Despesa / saída</option><option value="withdrawal">Sangria</option><option value="reinforcement">Reforço de caixa</option></select><input id="moveDesc" class="field w-full" placeholder="Descrição"><input id="moveAmount" type="number" min=".01" step=".01" class="field w-full" placeholder="Valor R$"><button class="amber w-full" onclick="movement()">Registrar movimentação</button><label class="label">Dinheiro contado no fechamento (R$)</label><input id="counted" type="number" min="0" step=".01" class="field w-full" placeholder="Valor contado"><button class="red w-full" onclick="closeCash()">Fechar caixa</button></div></section></div>
<style>
.btn,.primary,.green,.amber,.red{border-radius:12px;padding:10px 13px;font-weight:800;font-size:13px}
.btn{background:#e5e7eb;color:#1f2937}.dark .btn{background:#334155;color:#f8fafc}
.primary{background:#dc2626;color:white}.green{background:#059669;color:white}.amber{background:#d97706;color:white}.red{background:#e11d48;color:white}
.field{border:2px solid #e5e7eb;border-radius:11px;padding:10px 12px;background:white;color:#111827;min-width:0}
.dark .field{background:#0f172a;color:#f8fafc;border-color:#334155}
.label{font-size:12px;font-weight:800;display:block;margin-bottom:5px}
</style>
<script>
let state={products:[],orders:[],session:null,summary:{},activeOrder:null};
const $=id=>document.getElementById(id);
const fmt=c=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format((Number(c)||0)/100);
const cents=v=>Math.round(Number(v)*100);
const moneyInput=c=>((Number(c)||0)/100).toFixed(2);
async function api(url,method='GET',body=null){
 const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body===null?null:JSON.stringify(body)});
 const d=await r.json().catch(()=>({error:'Resposta inválida do servidor.'}));
 if(!r.ok) throw new Error(d.error||'Não foi possível concluir a operação.');
 return d;
}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function show(id){$(id).classList.add('show')} function closeModal(id){$(id).classList.remove('show')}
function toggleTheme(){document.documentElement.classList.toggle('dark');localStorage.setItem('cg-dark',document.documentElement.classList.contains('dark')?'1':'0')}
if(localStorage.getItem('cg-dark')==='1')document.documentElement.classList.add('dark');
async function load(){
 try{state=await api('/api/init');$('received').textContent=fmt(state.summary.received);$('pending').textContent=fmt(Math.max(0,state.summary.pending));$('openCount').textContent=state.summary.open_count;$('cashStatus').textContent=state.session?'Aberto':'Fechado';renderOrders();renderProductList()}catch(e){toast(e.message)}
}
function renderOrders(){
 const q=$('search').value.toLowerCase();
 const orders=state.orders.filter(o=>o.customer.toLowerCase().includes(q)||String(o.id).includes(q));
 $('orders').innerHTML=orders.length?orders.map(o=>`<article class="card bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm"><div class="flex justify-between gap-2"><div><p class="text-xs text-gray-500">Comanda #${o.id}</p><h3 class="font-black text-lg">${esc(o.customer)}</h3></div><span class="text-xs bg-amber-100 text-amber-800 rounded-full px-2 py-1 h-fit">Aberta</span></div><div class="grid grid-cols-2 gap-2 my-3"><div><p class="text-xs text-gray-500">Total</p><strong>${fmt(o.total_cents)}</strong></div><div><p class="text-xs text-gray-500">Saldo</p><strong class="text-rose-600">${fmt(o.balance_cents)}</strong></div></div><p class="text-xs text-gray-500 mb-3">${o.items.length} lançamento(s)</p><div class="flex gap-2"><button class="primary flex-1" onclick="openOrder(${o.id})">Lançar consumo</button><button class="green" onclick="quickPay(${o.id})">Pagar</button></div></article>`).join(''):'<div class="col-span-full text-center p-10 text-gray-500 bg-white dark:bg-slate-800 rounded-2xl">Nenhuma comanda aberta. Toque em “Nova comanda” para começar.</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newOrder(express=false){$('customer').value=express?'Balcão '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';show('newModal');$('customer').focus()}
async function createOrder(){try{const d=await api('/api/orders','POST',{customer:$('customer').value});closeModal('newModal');await load();openOrder(d.id)}catch(e){toast(e.message)}}
function openOrder(id){state.activeOrder=state.orders.find(o=>o.id===id);if(!state.activeOrder)return;renderActiveOrder();show('orderModal');renderProducts()}
function renderActiveOrder(){const o=state.activeOrder;if(!o)return;$('orderTitle').textContent=`Comanda #${o.id} · ${o.customer}`;$('orderTotal').textContent=`Total ${fmt(o.total_cents)} · Pago ${fmt(o.paid_cents)} · Saldo ${fmt(o.balance_cents)}`;$('items').innerHTML=o.items.length?o.items.map(i=>`<div class="flex justify-between items-center gap-2 bg-gray-50 dark:bg-slate-900 rounded-xl p-2"><div class="min-w-0"><p class="font-bold text-sm">${esc(i.description)} × ${i.quantity}</p><p class="text-xs text-gray-500">${fmt(i.unit_price_cents)} cada</p></div><div class="text-right"><strong>${fmt(i.unit_price_cents*i.quantity)}</strong><button class="block text-xs text-rose-600 font-bold ml-auto" onclick="removeItem(${i.id})">Remover</button></div></div>`).join(''):'<p class="text-sm text-gray-500">Ainda não há itens nesta comanda.</p>'}
function renderProducts(){
 const cats=[...new Set(state.products.map(p=>p.category))];const current=$('category').value;
 $('category').innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>`<option ${c===current?'selected':''}>${esc(c)}</option>`).join('');
 const q=$('productSearch').value.toLowerCase(),cat=$('category').value;
 const list=state.products.filter(p=>p.name.toLowerCase().includes(q)&&(!cat||p.category===cat));
 $('productButtons').innerHTML=list.map(p=>`<button class="card rounded-xl p-3 text-left hover:border-red-500" onclick="addProduct(${p.id})"><span class="block text-xs text-gray-500">${esc(p.category)}</span><strong class="block text-sm">${esc(p.name)}</strong><span class="text-red-600 font-black">${fmt(p.price_cents)}</span><span class="block text-xs mt-1">+ Adicionar</span></button>`).join('')||'<p class="text-sm text-gray-500 col-span-full">Nenhum produto encontrado.</p>';
}
async function refreshActive(){const id=state.activeOrder?.id;await load();if(id){state.activeOrder=state.orders.find(o=>o.id===id);if(state.activeOrder)renderActiveOrder();else{closeModal('orderModal');toast('Comanda encerrada.')}}}
async function addProduct(id){try{await api(`/api/orders/${state.activeOrder.id}/items`,'POST',{product_id:id,quantity:1});await refreshActive();renderProducts()}catch(e){toast(e.message)}}
async function addManual(){try{await api(`/api/orders/${state.activeOrder.id}/items`,'POST',{description:$('manualName').value,price:$('manualPrice').value,quantity:$('manualQty').value||1});$('manualName').value='';$('manualPrice').value='';$('manualQty').value='1';await refreshActive()}catch(e){toast(e.message)}}
async function removeItem(id){if(!confirm('Remover este item da comanda?'))return;try{await api('/api/items/'+id,'DELETE');await refreshActive()}catch(e){toast(e.message)}}
function openPayment(){const o=state.activeOrder;if(!o)return;if(o.balance_cents<=0){toast('Esta comanda já está paga.');return}$('payBalance').textContent='Saldo: '+fmt(o.balance_cents);$('payAmount').value=moneyInput(o.balance_cents);$('payReceived').value=moneyInput(o.balance_cents);cashFields();show('payModal')}
function quickPay(id){openOrder(id);setTimeout(openPayment,80)}
function cashFields(){$('cashFields').style.display=$('payMethod').value==='Dinheiro'?'block':'none'}
async function pay(){try{const o=state.activeOrder;const d=await api(`/api/orders/${o.id}/payments`,'POST',{amount:$('payAmount').value,received:$('payReceived').value,method:$('payMethod').value});closeModal('payModal');await refreshActive();toast(d.change_cents?`Pagamento registrado. Troco: ${fmt(d.change_cents)}`:d.balance_cents===0?'Pagamento concluído!':'Pagamento parcial registrado.')}catch(e){toast(e.message)}}
function openProducts(){show('productsModal');renderProductList()}
function renderProductList(){$('productList').innerHTML=state.products.map(p=>`<div class="flex justify-between items-center gap-2 border dark:border-slate-700 rounded-xl p-2"><div><strong>${esc(p.name)}</strong><p class="text-xs text-gray-500">${esc(p.category)} · ${fmt(p.price_cents)}</p></div><button class="text-rose-600 text-xs font-bold" onclick="deleteProduct(${p.id})">Desativar</button></div>`).join('')||'<p class="text-sm text-gray-500">Sem produtos.</p>'}
async function saveProduct(){try{await api('/api/products','POST',{name:$('pName').value,category:$('pCat').value,price:$('pPrice').value});$('pName').value=$('pCat').value=$('pPrice').value='';await load();toast('Produto cadastrado!')}catch(e){toast(e.message)}}
async function deleteProduct(id){if(!confirm('Desativar este produto? O histórico será preservado.'))return;try{await api('/api/products/'+id,'DELETE');await load()}catch(e){toast(e.message)}}
async function openCash(){show('cashModal');await cashReport()}
async function cashReport(){try{const r=await api('/api/cash/report');$('cashOpenForm').classList.toggle('hidden',!!r.session);$('cashMovementForm').classList.toggle('hidden',!r.session);$('cashReport').innerHTML=`<div class="rounded-xl bg-gray-50 dark:bg-slate-900 p-3"><p class="text-xs text-gray-500">Situação</p><strong>${r.session?'Caixa aberto desde '+new Date(r.session.opened_at).toLocaleString('pt-BR'):'Caixa fechado'}</strong>${r.session?`<p class="mt-2">Valor inicial: <b>${fmt(r.session.opening_cents)}</b></p><p>Dinheiro esperado: <b class="text-emerald-600">${fmt(r.expected_cents)}</b></p>`:''}</div><h3 class="font-bold mt-3">Recebimentos de hoje</h3>${r.payments.map(p=>`<div class="flex justify-between text-sm"><span>${esc(p.method)}</span><b>${fmt(p.total)}</b></div>`).join('')||'<p class="text-sm text-gray-500">Sem recebimentos hoje.</p>'}<h3 class="font-bold mt-3">Movimentações deste caixa</h3>${r.movements.map(m=>`<div class="flex justify-between gap-2 text-sm"><span>${esc(m.description)} <small class="text-gray-500">(${m.kind})</small></span><b>${fmt(m.amount_cents)}</b></div>`).join('')||'<p class="text-sm text-gray-500">Sem movimentações.</p>'}`}catch(e){toast(e.message)}}
async function startCash(){try{await api('/api/cash/open','POST',{opening:$('opening').value});await load();await cashReport();toast('Caixa aberto!')}catch(e){toast(e.message)}}
async function movement(){try{await api('/api/cash/movements','POST',{kind:$('moveKind').value,description:$('moveDesc').value,amount:$('moveAmount').value});$('moveDesc').value=$('moveAmount').value='';await cashReport();toast('Movimentação registrada.')}catch(e){toast(e.message)}}
async function closeCash(){if(!confirm('Confirma o fechamento do caixa?'))return;try{await api('/api/cash/close','POST',{counted:$('counted').value});await load();await cashReport();toast('Caixa fechado.')}catch(e){toast(e.message)}}
load();
</script>
</body>
</html>
